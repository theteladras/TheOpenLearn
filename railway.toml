[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300

# Migrations run at container start via `docker-entrypoint.sh` (reliable for Docker).
# Optional: add a Release Command `cd /app && prisma migrate deploy` if your platform
# supports it; `migrate deploy` is idempotent and safe to run twice.
